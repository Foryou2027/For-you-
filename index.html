/* =========================
   MINHA CONTA / CADASTRO
========================= */
function contasSalvas(){
  try{
    const lista=JSON.parse(localStorage.getItem("forYouContas")||"null");
    if(Array.isArray(lista)) return lista;
    const antiga=JSON.parse(localStorage.getItem("forYouConta")||"null");
    if(antiga && antiga.email){
      localStorage.setItem("forYouContas",JSON.stringify([antiga]));
      return [antiga];
    }
  }catch(e){}
  return [];
}
function salvarContas(lista){ localStorage.setItem("forYouContas",JSON.stringify(lista)); }
function contaSalva(){
  const lista=contasSalvas();
  if(!contaAtual) return null;
  return lista.find(c=>String(c.email||"").toLowerCase()===String(contaAtual.email||"").toLowerCase())||null;
}
function salvarConta(conta){
  const lista=contasSalvas();
  const i=lista.findIndex(c=>String(c.email||"").toLowerCase()===String(conta.email||"").toLowerCase());
  if(i>=0) lista[i]=conta; else lista.push(conta);
  salvarContas(lista);
  localStorage.setItem("forYouConta",JSON.stringify(conta));
}
function salvarContaAtual(){
  if(contaAtual) localStorage.setItem("forYouContaAtual",JSON.stringify(contaAtual));
  else localStorage.removeItem("forYouContaAtual");
}
function atualizarMinhaConta(){
  const loginBox=document.getElementById("contaLoginBox"), cadastroBox=document.getElementById("contaCadastroBox"), logada=document.getElementById("contaLogada");
  if(!loginBox||!cadastroBox||!logada) return;
  if(contaAtual){
    loginBox.style.display="none"; cadastroBox.style.display="none"; logada.style.display="block";
    document.getElementById("contaNome").textContent=contaAtual.nome;
    document.getElementById("contaEmail").textContent=contaAtual.email;
    document.getElementById("contaAvatar").textContent=(contaAtual.nome||"F").trim().charAt(0).toUpperCase();
    renderPedidosConta();
  }else{
    loginBox.style.display="block"; cadastroBox.style.display="none"; logada.style.display="none";
  }
  const adminCard=document.getElementById("adminCard");
  if(adminCard) adminCard.style.display=adminAutenticado()?"block":"none";
}
function mostrarCadastro(){document.getElementById("contaLoginBox").style.display="none";document.getElementById("contaCadastroBox").style.display="block";document.getElementById("loginMensagem").textContent="";}
function mostrarLogin(){document.getElementById("contaCadastroBox").style.display="none";document.getElementById("contaLoginBox").style.display="block";document.getElementById("cadastroMensagem").textContent="";}
function cadastrarConta(event){
  event.preventDefault();
  const nome=document.getElementById("cadNome").value.trim(), email=document.getElementById("cadEmail").value.trim().toLowerCase(), telefone=document.getElementById("cadTelefone").value.trim(), endereco=document.getElementById("cadEndereco").value.trim(), senha=document.getElementById("cadSenha").value, confirmar=document.getElementById("cadConfirmar").value, msg=document.getElementById("cadastroMensagem");
  if(nome.length<2){msg.textContent="Digite seu nome completo.";return false;}
  if(!/^\S+@\S+\.\S+$/.test(email)){msg.textContent="Digite um e-mail válido.";return false;}
  if(senha.length<6){msg.textContent="A senha precisa ter pelo menos 6 caracteres.";return false;}
  if(senha!==confirmar){msg.textContent="As senhas não são iguais.";return false;}
  const lista=contasSalvas();
  if(lista.some(c=>String(c.email||"").toLowerCase()===email)){msg.textContent="Já existe uma conta com este e-mail.";return false;}
  const conta={nome,email,telefone,endereco,senha,pedidos:[]};
  lista.push(conta); salvarContas(lista); localStorage.setItem("forYouConta",JSON.stringify(conta));
  contaAtual={nome,email,telefone,endereco}; salvarContaAtual(); carregarDadosDaConta(); atualizarMinhaConta(); atualizar(); renderProdutos(); renderOfertas(); renderKits(); renderMaisVendidos(); renderRecomendados();
  document.getElementById("contaMensagem").textContent="Conta criada com sucesso! 💕"; return false;
}
function fazerLogin(event){
  event.preventDefault();
  const email=document.getElementById("loginEmail").value.trim().toLowerCase(), senha=document.getElementById("loginSenha").value, msg=document.getElementById("loginMensagem"), lista=contasSalvas();
  const conta=lista.find(c=>String(c.email||"").toLowerCase()===email);
  if(!conta){msg.textContent="Conta não encontrada. Confira o e-mail ou cadastre-se.";return false;}
  if(conta.senha!==senha){msg.textContent="E-mail ou senha incorretos.";return false;}
  contaAtual={nome:conta.nome,email:conta.email,telefone:conta.telefone||"",endereco:conta.endereco||""};
  localStorage.setItem("forYouConta",JSON.stringify(conta)); salvarContaAtual(); carregarDadosDaConta(); atualizarMinhaConta(); atualizar(); renderProdutos(); renderOfertas(); renderKits(); renderMaisVendidos(); renderRecomendados();
  document.getElementById("contaMensagem").textContent="Login realizado com sucesso! 💕"; return false;
}
function sairDaConta(){
  // Salva os dados da conta atual antes de encerrar a sessão.
  if(contaAtual){ salvar(); salvarFavoritos(); }
  contaAtual=null;
  salvarContaAtual();
  // Limpa os dados em memória para que o próximo cliente nunca veja
  // o carrinho ou favoritos da conta anterior.
  carrinho=[];
  favoritos=[];
  localStorage.removeItem("forYouCarrinho");
  localStorage.removeItem("forYouFavoritos");
  atualizar();
  renderProdutos(); renderOfertas(); renderKits(); renderMaisVendidos(); renderRecomendados();
  renderFavoritos();
  atualizarMinhaConta();
  mostrarLogin();
  document.getElementById("loginEmail").value="";
  document.getElementById("loginSenha").value="";
}
function editarDadosConta(){
  const conta=contaSalva();if(!conta)return;
  const nome=prompt("Nome completo:",conta.nome);if(nome===null)return; const email=prompt("E-mail:",conta.email);if(email===null)return; const telefone=prompt("Telefone:",conta.telefone||"");if(telefone===null)return;
  const novoEmail=email.trim().toLowerCase();
  if(!nome.trim()||!/^\S+@\S+\.\S+$/.test(novoEmail)){alert("Preencha nome e e-mail corretamente.");return;}
  const lista=contasSalvas();
  if(novoEmail!==String(conta.email).toLowerCase() && lista.some(c=>String(c.email||"").toLowerCase()===novoEmail)){alert("Este e-mail já está sendo usado por outra conta.");return;}
  const antigoEmail=conta.email;
  conta.nome=nome.trim();conta.email=novoEmail;conta.telefone=telefone.trim();
  const i=lista.findIndex(c=>String(c.email||"").toLowerCase()===String(antigoEmail||"").toLowerCase()); if(i>=0) lista[i]=conta; else lista.push(conta); salvarContas(lista); localStorage.setItem("forYouConta",JSON.stringify(conta));
  contaAtual={nome:conta.nome,email:conta.email,telefone:conta.telefone,endereco:conta.endereco||""}; salvarContaAtual(); carregarDadosDaConta(); atualizarMinhaConta(); atualizar(); document.getElementById("contaMensagem").textContent="Dados atualizados com sucesso!";
}
function editarEnderecoConta(){const conta=contaSalva();if(!conta)return;const endereco=prompt("Endereço completo:",conta.endereco||"");if(endereco===null||!endereco.trim())return;conta.endereco=endereco.trim();salvarConta(conta);contaAtual.endereco=conta.endereco;salvarContaAtual();alert("Endereço atualizado com sucesso!");}
function alterarSenhaConta(){const conta=contaSalva();if(!conta)return;const atual=prompt("Digite sua senha atual:");if(atual!==conta.senha){alert("Senha atual incorreta.");return;}const nova=prompt("Digite a nova senha (mín. 6 caracteres):");if(!nova||nova.length<6){alert("A nova senha precisa ter pelo menos 6 caracteres.");return;}const confirmar=prompt("Confirme a nova senha:");if(nova!==confirmar){alert("As senhas não são iguais.");return;}conta.senha=nova;salvarConta(conta);alert("Senha alterada com sucesso!");}
function mostrarPedidosConta(){const conta=contaSalva();const pedidos=(conta&&conta.pedidos)||[];abrirConta();setTimeout(()=>{const el=document.getElementById("contaPedidosDetalhes");if(el){el.innerHTML=pedidos.length?pedidos.slice().reverse().map(p=>`<div class="conta-pedido"><div class="conta-pedido-top"><strong>${p.numero||"Pedido"}</strong><span class="pedido-badge">${p.status||"Confirmado"}</span></div><div class="pedido-meta">${moeda(Number(p.total||0))}</div></div>`).join(""):"<p style=\"color:#777;font-size:10px\">Você ainda não possui pedidos.</p>";}},50);}

  padding:14px;
}

.newsletter button{
  border:0;
  background:#351f27;
  color:white;
  padding:0 20px;
}

/* =========================
   FOOTER
========================= */

footer{
  background:#291d21;
  color:white;
  padding:60px 5% 20px;
}

.footer-grid{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:30px;
}

.footer-logo{
  font-family:Georgia,serif;
  font-size:40px;
  color:#efaebe;
}

footer h3{
  font-size:10px;
  letter-spacing:2px;
  margin-bottom:15px;
}

footer a{
  display:block;
  color:#bbb;
  font-size:10px;
  margin:10px 0;
  text-decoration:none;
}

footer p{
  color:#aaa;
  font-size:10px;
  line-height:1.8;
  max-width:300px;
}

.copyright{
  border-top:1px solid #45363b;
  text-align:center;
  padding-top:20px;
  margin-top:40px;
  color:#777;
  font-size:9px;
}

/* =========================
   OVERLAY
========================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:500;
}

.overlay.ativo{
  display:block;
}

/* =========================
   CARRINHO
========================= */

.carrinho{
  position:fixed;
  right:0;
  top:0;
  height:100vh;
  width:min(500px,100%);
  background:white;
  z-index:501;
  transform:translateX(100%);
  transition:.3s;
  display:flex;
  flex-direction:column;
}

.carrinho.aberto{
  transform:translateX(0);
}

.carrinho-header{
  padding:20px;
  border-bottom:1px solid #ead9de;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.carrinho-header h2{
  font-family:Georgia,serif;
  font-size:28px;
}

.fechar{
  border:0;
  background:none;
  font-size:28px;
}

.itens{
  flex:1;
  overflow:auto;
  padding:20px;
}

.item{
  display:flex;
  gap:12px;
  border-bottom:1px solid #ead9de;
  padding:14px 0;
}

.item-img{
  width:65px;
  height:70px;
  background:#f5e2e7;
  flex-shrink:0;
}

.item-dados{
  flex:1;
}

.item-dados strong{
  font-family:Georgia,serif;
  font-size:18px;
}

.item-preco{
  color:#b83f61;
  font-weight:bold;
  margin:5px 0;
}

.quantidade{
  display:flex;
  align-items:center;
  gap:8px;
}

.quantidade button{
  width:25px;
  height:25px;
  border:1px solid #ddd;
  background:white;
}

.remover{
  border:0;
  background:none;
  color:#999;
  font-size:8px;
  margin-top:5px;
}

/* =========================
   FRETE GRÁTIS
========================= */

.frete-gratis{
  padding:14px 20px;
  background:#fff8fa;
  border-top:1px solid #ead9de;
  border-bottom:1px solid #ead9de;
}

.frete-gratis p{
  font-size:9px;
  margin-bottom:8px;
}

.barra{
  height:7px;
  background:#ead9de;
  border-radius:10px;
  overflow:hidden;
}

.barra-progresso{
  height:100%;
  width:0;
  background:#b83f61;
  transition:.3s;
}

/* =========================
   FRETE
========================= */

.frete{
  padding:16px 20px;
  background:#fffafa;
  max-height:38vh;
  overflow:auto;
}

.frete h3{
  font-size:11px;
  margin-bottom:12px;
}

.cep-linha{
  display:flex;
  gap:6px;
}

.cep-linha input{
  flex:1;
  height:42px;
  border:1px solid #ddcbd0;
  padding:10px;
}

.cep-linha button{
  background:#351f27;
  color:white;
  border:0;
  padding:0 14px;
  font-size:9px;
  font-weight:bold;
}

.cep-link{
  font-size:8px;
  color:#b83f61;
  display:block;
  margin:8px 0;
}

.endereco{
  display:none;
  margin-top:10px;
}

.endereco.ativo{
  display:block;
}

.endereco-box{
  background:white;
  border:1px solid #ead9de;
  padding:10px;
  font-size:9px;
  line-height:1.7;
  margin-bottom:10px;
}

.campos{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.campos input{
  width:100%;
  height:38px;
  border:1px solid #ddcbd0;
  padding:8px;
  font-size:9px;
}

.completo{
  grid-column:1/-1;
}

.entregas{
  margin-top:15px;
}

.entregas h4{
  font-size:9px;
  margin-bottom:8px;
}

.entrega{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid #ead9de;
  background:white;
  padding:11px;
  margin-bottom:6px;
  cursor:pointer;
}

.entrega-esq{
  display:flex;
  gap:8px;
  align-items:center;
}

.entrega input{
  accent-color:#b83f61;
}

.entrega-nome{
  font-size:9px;
  font-weight:bold;
}

.prazo{
  display:block;
  color:#888;
  font-size:7px;
  margin-top:3px;
}

.valor-entrega{
  color:#b83f61;
  font-size:9px;
  font-weight:bold;
}

/* =========================
   CUPOM
========================= */

.cupom{
  padding:14px 20px;
  border-top:1px solid #ead9de;
}

.cupom h3{
  font-size:10px;
  margin-bottom:8px;
}

.cupom-linha{
  display:flex;
  gap:6px;
}

.cupom input{
  flex:1;
  border:1px solid #ddcbd0;
  padding:11px;
  font-size:9px;
  text-transform:uppercase;
}

.cupom button{
  background:#351f27;
  color:white;
  border:0;
  padding:0 15px;
  font-size:9px;
  font-weight:bold;
}

.cupom-msg{
  font-size:8px;
  margin-top:7px;
  color:#b83f61;
}

/* =========================
   RESUMO
========================= */

.resumo{
  padding:15px 20px;
  border-top:1px solid #ead9de;
  background:white;
}

.linha{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  margin:7px 0;
}

.desconto{
  color:#b83f61;
}

.total{
  font-size:17px;
  font-weight:bold;
  margin-top:10px;
}

.whatsapp{
  width:100%;
  height:48px;
  border:0;
  background:#25d366;
  color:white;
  font-weight:bold;
  font-size:9px;
  margin-top:10px;
}

/* =========================
   PÁGINA PRODUTO
========================= */

.produto-detalhe{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:45px;
  background:white;
  padding:25px;
  border:1px solid #ead9de;
}

.detalhe-img{
  height:500px;
  overflow:hidden;
  background:#f6e5e9;
}

.detalhe-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.detalhe-info{
  padding:20px 5px;
}

.detalhe-marca{
  color:#a88955;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.detalhe-info h1{
  font-family:Georgia,serif;
  font-weight:normal;
  font-size:42px;
  margin:15px 0;
}

.detalhe-preco{
  color:#b83f61;
  font-size:26px;
  font-weight:bold;
  margin:15px 0;
}

.detalhe-descricao{
  color:#6d6165;
  font-size:12px;
  line-height:1.9;
  margin:20px 0;
}

.detalhe-acoes{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.detalhe-quantidade{
  display:flex;
  align-items:center;
  border:1px solid #ddd;
}

.detalhe-quantidade button{
  width:40px;
  height:45px;
  border:0;
  background:white;
}

.detalhe-quantidade span{
  width:35px;
  text-align:center;
}

.btn-detalhe{
  flex:1;
  background:#351f27;
  color:white;
  border:0;
  font-weight:bold;
  font-size:10px;
}

.btn-fav-detalhe{
  width:50px;
  background:white;
  border:1px solid #351f27;
  font-size:20px;
}

/* =========================
   AVALIAÇÕES
========================= */

.avaliacoes{
  max-width:1100px;
  margin:30px auto;
  background:white;
  border:1px solid #ead9de;
  padding:30px;
}

.avaliacoes h2{
  font-family:Georgia,serif;
  font-size:30px;
  font-weight:normal;
  margin-bottom:20px;
}

.nota-geral{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.nota-numero{
  font-family:Georgia,serif;
  font-size:40px;
}

.avaliacao{
  border-top:1px solid #ead9de;
  padding:18px 0;
}

.avaliacao strong{
  font-size:11px;
}

.avaliacao p{
  color:#777;
  font-size:10px;
  margin-top:7px;
  line-height:1.7;
}

/* =========================
   MINHA CONTA
========================= */

.conta{
  max-width:900px;
  margin:auto;
  background:white;
  border:1px solid #ead9de;
  padding:35px;
}

.conta-header{
  text-align:center;
  margin-bottom:30px;
}

.conta-header h1{
  font-family:Georgia,serif;
  font-weight:normal;
  font-size:42px;
}

.conta-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.conta-card{
  border:1px solid #ead9de;
  padding:25px;
  transition:.2s;
}

.conta-card:hover{
  border-color:#b83f61;
}

.conta-card h3{
  font-family:Georgia,serif;
  font-size:20px;
  margin-bottom:8px;
}

.conta-card p{
  color:#777;
  font-size:10px;
}


/* =========================
   AUTENTICAÇÃO / CADASTRO
========================= */
.conta-auth{max-width:520px;margin:0 auto 25px;border:1px solid #ead9de;padding:28px;background:#fffafa}
.conta-auth h2{font-family:Georgia,serif;font-size:28px;font-weight:normal;margin-bottom:8px;text-align:center}
.conta-auth p{color:#777;font-size:10px;line-height:1.6;text-align:center;margin-bottom:18px}
.conta-form{display:grid;gap:10px}
.conta-form input{width:100%;height:43px;border:1px solid #ddcbd0;padding:10px 12px;outline:none;background:white}
.conta-form input:focus{border-color:#b83f61}
.conta-form button,.conta-principal-btn{height:44px;border:0;background:#351f27;color:white;font-size:9px;font-weight:bold;letter-spacing:1px}
.conta-secundario{background:white!important;color:#351f27!important;border:1px solid #351f27!important}
.conta-troca{border:0;background:none;color:#b83f61;font-size:9px;margin-top:12px;width:100%}
.conta-mensagem{min-height:18px;text-align:center;font-size:9px;margin-top:10px}
.conta-logada{text-align:center}
.conta-logada .avatar{width:62px;height:62px;border-radius:50%;background:#f8e4e9;color:#b83f61;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-family:Georgia,serif;font-size:25px}
.conta-logada strong{display:block;font-family:Georgia,serif;font-size:22px}
.conta-logada span{display:block;color:#777;font-size:10px;margin:5px 0 16px}

/* =========================
   WHATSAPP FLUTUANTE
========================= */

.whatsapp-flutuante{
  position:fixed;
  right:22px;
  bottom:22px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#25d366;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  font-size:27px;
  z-index:450;
  box-shadow:0 8px 25px #0003;
}

.whatsapp-flutuante:hover{
  transform:scale(1.08);
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .header{
    padding:15px;
  }

  .header-top{
    align-items:flex-start;
  }

  .logo{
    min-width:auto;
  }

  .logo h1{
    font-size:32px;
  }

  .logo span{
    font-size:7px;
  }

  .menu-lista{
    justify-content:flex-start;
    overflow-x:auto;
    flex-wrap:nowrap;
    padding:4px 2px 10px;
  }

  .menu-btn{
    white-space:nowrap;
  }

  .dropdown{
    position:fixed;
    top:150px;
    left:20px;
    right:20px;
    width:auto;
    transform:none;
  }

  .destaques-menu{
    overflow-x:auto;
    justify-content:flex-start;
    padding-bottom:5px;
  }

  .destaque-btn{
    white-space:nowrap;
  }

  .produtos{
    grid-template-columns:repeat(2,1fr);
  }

  .beneficios{
    grid-template-columns:1fr;
  }

  .beneficio{
    border-right:0;
    border-bottom:1px solid #ead9de;
  }

  .footer-grid{
    grid-template-columns:1fr 1fr;
  }

  .hero h2{
    font-size:48px;
  }

  .produto-detalhe{
    grid-template-columns:1fr;
    gap:20px;
  }

  .detalhe-img{
    height:400px;
  }

  .subcategorias{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){

  .logo h1{
    font-size:28px;
  }

  .acoes{
    font-size:21px;
    gap:12px;
  }

  .menu-lista{
    gap:7px;
  }

  .menu-btn{
    padding:9px 13px;
    font-size:10px;
  }

  .produtos{
    gap:10px;
  }

  .produto-img{
    height:190px;
  }

  .nome{
    font-size:18px;
  }

  .footer-grid{
    grid-template-columns:1fr;
  }

  .hero{
    min-height:470px;
  }

  .newsletter form{
    flex-direction:column;
    gap:6px;
  }

  .newsletter button{
    height:45px;
  }

  .conta-grid{
    grid-template-columns:1fr;
  }

  .detalhe-info h1{
    font-size:32px;
  }

  .detalhe-acoes{
    flex-wrap:wrap;
  }

  .btn-detalhe{
    min-height:45px;
  }

  .subcategorias{
    grid-template-columns:1fr 1fr;
  }
}
