<script id="fy-categorias-todos-supabase-fix">
(function(){

  function normalizar(valor){
    return (valor || '')
      .toString()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .toLowerCase()
      .trim();
  }

  function catalogoCompleto(){
    try{
      if(typeof produtos !== 'undefined' && Array.isArray(produtos)){
        return produtos;
      }
    }catch(e){}

    if(Array.isArray(window.FOR_YOU_TODOS_PRODUTOS)){
      return window.FOR_YOU_TODOS_PRODUTOS;
    }

    return [];
  }

  function pertenceCategoria(produto, categoria){
    const cat = normalizar(categoria);
    const pc = normalizar(produto.categoria);
    const ps = normalizar(produto.subcategoria);

    /* Cabelo:
       aceita produtos cadastrados como Cabelo
       e também os antigos Corpo > Cabelos
    */
    if(cat === 'cabelo'){
      return (
        pc === 'cabelo' ||
        ps === 'cabelo' ||
        ps === 'cabelos'
      );
    }

    /* Corpo não mistura mais os itens da categoria Cabelo */
    if(cat === 'corpo'){
      return pc === 'corpo' &&
             ps !== 'cabelo' &&
             ps !== 'cabelos';
    }

    /* Kits */
    if(cat === 'kits' || cat === 'kit'){
      return (
        pc === 'kits' ||
        pc === 'kit' ||
        pc === 'kits promocionais' ||
        pc === 'kit promocional'
      );
    }

    return pc === cat;
  }

  function correspondeSubcategoria(produto, subcategoria){
    if(!subcategoria) return true;

    return normalizar(produto.subcategoria) ===
           normalizar(subcategoria);
  }

  function criarCardSeguro(produto){
    try{
      if(typeof criarCard === 'function'){
        return criarCard(produto);
      }

      if(typeof window.criarCard === 'function'){
        return window.criarCard(produto);
      }
    }catch(e){
      console.warn('Erro ao criar card:', produto.nome, e);
    }

    return null;
  }

  function renderizarCategoria(categoria, subcategoria){
    const todos = catalogoCompleto();

    const lista = todos.filter(function(produto){

      if(!produto) return false;

      if(produto.ativo === false) return false;

      if(!pertenceCategoria(produto, categoria)){
        return false;
      }

      if(!correspondeSubcategoria(produto, subcategoria)){
        return false;
      }

      return true;
    });

    const grade =
      document.getElementById('listaProdutos') ||
      document.getElementById('fySubcatProdutos');

    if(!grade) return;

    grade.innerHTML = '';

    lista.forEach(function(produto){
      const card = criarCardSeguro(produto);

      if(card){
        grade.appendChild(card);
      }
    });

    if(!lista.length){
      grade.innerHTML =
        '<div class="fy-novidades-vazio">' +
        '<span>♡</span>' +
        '<strong>Nenhum produto encontrado</strong>' +
        '<p>Não encontramos produtos nesta categoria.</p>' +
        '</div>';
    }

    const titulo =
      document.querySelector('#novidades>.titulo h2') ||
      document.getElementById('fySubcatTitulo');

    if(titulo){
      const nomes = {
        labios:'Lábios',
        pele:'Pele',
        olhos:'Olhos',
        skincare:'Skincare',
        face:'Face',
        acessorios:'Acessórios',
        corpo:'Corpo',
        cabelo:'Cabelo',
        kits:'Kits Promocionais'
      };

      titulo.textContent =
        nomes[normalizar(categoria)] || categoria;
    }

    const descricao =
      document.querySelector('#novidades>.titulo p') ||
      document.getElementById('fySubcatContagem');

    if(descricao){
      descricao.textContent =
        lista.length +
        ' produto' +
        (lista.length === 1 ? '' : 's');
    }

    window.fyCategoriaAtual = categoria;
    window.fySubcategoriaAtual = subcategoria || '';

    /* mantém os botões/filtros existentes */
    try{
      if(typeof montarFiltros === 'function'){
        montarFiltros(categoria, subcategoria || '');
      }
    }catch(e){}

    const secao = document.getElementById('novidades');

    if(secao){
      secao.classList.add('fy-category-active');

      try{
        secao.scrollIntoView({
          behavior:'smooth',
          block:'start'
        });
      }catch(e){}
    }
  }

  /* CORREÇÃO PRINCIPAL */
  window.selecionarSubcategoria = function(categoria, subcategoria){
    renderizarCategoria(
      categoria,
      subcategoria || ''
    );
  };

  /* Ao clicar na categoria principal = TODOS */
  window.abrirSubmenuHomeFY = function(categoria){
    window.selecionarSubcategoria(categoria, '');
  };

})();
</script>
